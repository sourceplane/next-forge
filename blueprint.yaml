# The next-forge card: what the console's Blueprints page renders and the
# platform's bootstrap door consumes.
#
# THIS FILE IS NOT THE BUILD. `spec.bootstrap.blueprint` names the build
# document — `repo-blueprint.yaml`, whose phases a runner places. This card is
# what an operator reads and fills in before pressing Build, and
# `testing/manifest.test.sh` compares every list below to the document that
# actually does the thing, not to a copy of itself.
#
# The division of labour with the registry is strict: the registry (orun-cloud
# `infra/baselines-registry/baselines.yaml`) owns identity and commerce — id,
# visibility, tier, the pinned tag. This file owns the build contract. Neither
# restates the other, which is why there is no `tag` here: this file is
# fetched AT the tag the registry pins.
apiVersion: orun.io/v1
kind: Blueprint
metadata:
  name: next-forge
  displayName: next-forge — a production SaaS monorepo on Cloudflare Workers and Supabase
  description: >
    Vercel's next-forge as a product of its own: the app (a dashboard behind
    Clerk, with search, a webhooks portal, collaboration and notifications),
    the marketing site (home, pricing, a blog, legal pages and a contact form
    in six languages) and the API (Stripe and Clerk webhooks, a daily
    keep-alive), each built by OpenNext into its own Cloudflare Worker, over a
    Supabase project's Postgres reached through Hyperdrive, files in R2 and
    the contact form's rate limit in Workers KV. Terraform creates all four
    per environment, db-migrate applies the schema, and CI deploys it to stage
    and prod on merge, in that order. Every SaaS — Clerk, Stripe, BaseHub,
    Resend and the rest — connects after the build. Live in about twenty
    minutes.
  tags: [saas, monorepo, turborepo, supabase, r2, kv, cloudflare, nextjs]
spec:
  source:
    repo: sourceplane/next-forge
    # No `tag`. The registry pins it; this file is fetched at it.

  # ── What the operator reads first ────────────────────────────────────────
  overview:
    lede: >
      A production SaaS monorepo — an app, a marketing site and an API, one
      Worker each — with Supabase for Postgres, R2 for files, KV for rate
      limits and Terraform holding the data plane. Every SaaS it wires is
      optional: it goes live first and connects them when you have them.
    architecture:
      - layer: Edge
        items: [app, web, api]
      - layer: Data
        items: [Supabase Postgres, Hyperdrive, R2, Workers KV, db-migrate]
      - layer: Delivery
        items: [Terraform, GitHub Actions, OpenNext]
    outcome:
      - The app, the marketing site and the API live on stage and prod
      - A Supabase project, a bucket and a namespace per environment, migrated on merge
      - Clerk, Stripe, BaseHub and the rest turn on when you store their keys

  requires:
    # GitHub arrives as the App installation plus the repo link; Cloudflare
    # and Supabase are the two provider connections the build mints from.
    # The SaaS the template wires (Clerk, Stripe, BaseHub, Resend, …) are not
    # here: no platform brokers them, the product deploys and serves without
    # them, and its owner stores their keys afterwards (the product's README,
    # "Connecting a service").
    integrations: [github, cloudflare, supabase]
    apiKeyRole: admin          # secret writes need the admin floor

  # Every input is collected by the console: keys are lowercase (the
  # platform's reader refuses anything else), every one carries the `pattern`
  # its value is checked against before Continue, and a value the console
  # already holds says so with `from`. repo-blueprint.yaml declares the same
  # names; `repoPrivate`, `orunWorkspace` and `epicSlug` are build inputs with
  # defaults (or filled from the build's workspace) and are not asked.
  #
  # NOR IS THE DOMAIN. The app goes live on workers.dev, and a domain is an
  # owner's step after the bootstrap: `productdomain` defaults to empty, the
  # rebrand writes the reserved placeholder `<reponame>.example.com` where
  # the domain goes, and the product's README ("Custom domain") says how to
  # set it. Nothing that needs a domain is removed — it waits for one.
  inputs:
    - key: reponame
      label: Repo name
      pattern: "^[a-z][a-z0-9-]{1,38}$"
      # The operator picked the repository; its name IS this value.
      from: repo.name
    - key: productname
      label: Product name
      pattern: "^[A-Za-z0-9][A-Za-z0-9 .,'&-]{1,48}$"
      help: The name people see — the marketing site's logo, the app's sign-in panel, every page title.
      example: Acme Cloud
    - key: githuborg
      label: GitHub organisation
      pattern: "^[A-Za-z0-9][A-Za-z0-9-]*$"
      help: The GitHub org or user the product's repository is created under.
      # DERIVED FROM THE CHOSEN REPOSITORY: its owner IS this value. Declared
      # because repo-blueprint.yaml requires it — a build may declare more
      # inputs than this card, but not require one nobody supplies.
      from: repo.owner
    - key: subdomain
      label: workers.dev subdomain
      pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
      help: The workers.dev subdomain of the Cloudflare account the three Workers deploy into.
      example: acme
      # READ FROM THE CLOUDFLARE CONNECTION, not asked. The subdomain belongs
      # to the account the same way its id does, and there is exactly one
      # right answer — a typed one could only be wrong, and wrong showed up
      # after deploy, in the origins the apps link each other by, the smokes,
      # the phase probes and the verify URLs below. The integration reads it
      # from Cloudflare at connect and on its hourly health check; the
      # bootstrap door fills this input from the connection the build is
      # BOUND to, the same one CLOUDFLARE_ACCOUNT_ID and the deploy tokens
      # mint from, so all three name one account. The console renders no
      # field for it. An account with no workers.dev subdomain refuses the
      # build at the door, naming the fix, before anything is created.
      from: connection.cloudflare.workersSubdomain

  # ── PREVIEW ONLY. repo-blueprint.yaml's `orun.integrations/reconcile@v1`
  # hooks mint these, brokered, during 01-product — one hook per provider. ─
  # Transcribed from those hooks' own `provider:` and `secrets:` ({key,
  # template}) values, in their order, so testing/manifest.test.sh compares
  # this list to the document that mints them. The console renders them
  # read-only: no credential is ever typed, shown or stored. Keys that
  # already exist are kept. Six keys, six scopes, on purpose — the deploy
  # token deliberately cannot touch Hyperdrive or R2. The SaaS keys are not
  # here: no connection mints them.
  secrets:
    - key: CLOUDFLARE_API_TOKEN
      provider: cloudflare
      template: workers-deploy
      why: Deploys the three Workers and their static assets, and creates the KV namespace
    - key: CLOUDFLARE_HYPERDRIVE_TOKEN
      provider: cloudflare
      template: hyperdrive-edit
      why: Hyperdrive — the deploy token deliberately cannot touch it
    - key: CLOUDFLARE_R2_TOKEN
      provider: cloudflare
      template: r2-data
      why: The R2 bucket — the deploy token deliberately cannot touch it
    - key: CLOUDFLARE_ACCOUNT_ID
      provider: cloudflare
      template: account-id
      why: Connection fact, not a secret
      fact: true
    - key: SUPABASE_ACCESS_TOKEN
      provider: supabase
      template: management-access
      why: Project create and migrations
    - key: SUPABASE_ORG_ID
      provider: supabase
      template: org-id
      why: Connection fact, not a secret
      fact: true

  # ── PREVIEW ONLY. repo-blueprint.yaml's run-level `hooks.preInstantiate`
  # opens these — the epic, every milestone in this order, every task — before
  # the first phase places. Idempotent by identity, so a re-run finds what it
  # made before.
  programme:
    epicSlug: next-forge-baselining    # = repo-blueprint.yaml's `epicSlug` default
    epicName: "next-forge baselining — {productname}"
    milestones:
      - name: 01-product
      - name: 02-docs

  bootstrap:
    # THE BUILD DOCUMENT. There is no umbrella workflow and no agent brief:
    # every phase is declared in it and orun runs it.
    blueprint: repo-blueprint.yaml
    # Summed from the phases' expectedMinutes (19 + 1). An estimate until a
    # bootstrap measures it: a Supabase project takes five to seven minutes to
    # come up, the app's and the API's deploys wait on it, on Hyperdrive and
    # on the migrations, and three Next.js builds run beside each other.
    expectedMinutes: 20
    tokenChannel: ORUN_TOKEN_FILE   # how a runner hands over its refreshed token
  verify:
    urls:
      - "https://{reponame}-web-{env}.{subdomain}.workers.dev"
      - "https://{reponame}-web-{env}.{subdomain}.workers.dev/api/health"
      - "https://{reponame}-app-{env}.{subdomain}.workers.dev/api/health"
      - "https://{reponame}-api-{env}.{subdomain}.workers.dev/health"
    envs: [stage, prod]
