apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: NF-5
  title: "A baseline"
spec:
  goal: next-forge becomes an Orun baseline that builds a new product in one landing
  affects:
    - blueprint.yaml
    - repo-blueprint.yaml
    - .baseline
    - BOOTSTRAP.md
    - README.md
    - docs/phases
    - hooks
    - testing
    - tooling
    - ai
    - .github/workflows
    - specs
    - tasks
    - apps
    - infra
    - packages
    - tests
  doneWhen:
    - blueprint.yaml and repo-blueprint.yaml agree (testing/manifest.test.sh)
    - the rebrand renames this baseline's identity and keeps upstream's mentions (testing/rebrand.test.sh)
    - Baseline CI is green: contract tests, the docs check, the blueprint job and the product job
  gates: []
