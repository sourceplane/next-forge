apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: web-tests
  description: The marketing site's and its packages' tests (the CMS sample content, the code highlighter, the rate limit on KV, the health check, the wrangler config), run on every pull request
spec:
  type: turbo-package
  lifecycle: production
  owner: platform
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture, title: Architecture }
      - { path: docs/runbook.md, role: runbook, title: Runbook }
  domain: tests
  # The suites import the app and the packages it is built from.
  change:
    inputs:
      - apps/web/**
      - packages/**
      - pnpm-lock.yaml
  subscribe:
    environments:
      - name: dev
        profile: quick-check
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"
    buildCommand: pnpm exec turbo run build --filter=./
    typecheckCommand: pnpm exec turbo run typecheck --filter=./
    preBuildCommand: pnpm exec turbo run test --filter=./
  labels:
    team: platform
    layer: test
